version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    environment:
      - BASELINE_WEIGHT=0.3
      - TRANSFORMER_WEIGHT=0.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  demo:
    build: .
    command: ["python", "app.py"]
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    depends_on:
      - api
    restart: unless-stopped
